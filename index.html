<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Accounting Support Hub</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="gate-overlay">
  <div class="gate-card">
    <span class="brand-eyebrow">Street</span>
    <h2>Accounting Support Hub</h2>
    <p>This is an internal tool. Enter the password to continue.</p>
    <input type="password" id="gatePassword" placeholder="Password" autocomplete="off">
    <button onclick="checkGatePassword()">Unlock</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div id="app-content">

<header class="hub-header">
  <div>
    <span class="brand-eyebrow">Street</span>
    <h1>Accounting Support Hub</h1>
    <p>Quickly check a client's Accounting onboarding, reconciliation and training status &mdash; read-only, no Rocketlane access needed.</p>
  </div>
  <div class="sync-pill">
    <button class="btn-refresh" onclick="refreshData()">↻ Refresh data</button>
    <span class="sync-time" id="syncTime">Last synced: loading…</span>
  </div>
</header>

<div class="shell">

  <section id="lookup-view">
    <div class="search-wrap">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search client, Network ID or contact…" oninput="renderResults()">
      </div>
      <div class="chips" id="chipRow"></div>
      <div class="adv-filters" id="advFilterRow"></div>
    </div>

    <div class="results" id="resultsList">
      <div class="empty-state">Loading Support Hub data…</div>
    </div>
  </section>

  <section id="detail-view">
    <button class="back-link" onclick="showLookup()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to search
    </button>
    <div id="detailContent"></div>
  </section>

</div>

</div>

<script src="assets/js/gate.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
